<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workspace Preview</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #030712;
      color: #fff;
    }

    .workspace {
      min-height: 100vh;
      background: #030712;
      position: relative;
      overflow: hidden;
    }

    .bg-pattern {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, #4f4f4f2e 1px, transparent 1px),
        linear-gradient(to bottom, #4f4f4f2e 1px, transparent 1px);
      background-size: 14px 24px;
    }

    .bg-glow {
      position: absolute;
      left: 50%;
      top: 0;
      width: 1000px;
      height: 500px;
      transform: translateX(-50%);
      background: radial-gradient(circle 400px at 50% 300px, #3b82f625, transparent);
    }

    .content {
      position: relative;
      z-index: 10;
      padding: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 40px;
    }

    @media (min-width: 768px) {
      .grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .code-col {
        grid-column: span 3 / span 3;
      }
    }

    .card {
      background: #1f2937;
      border-radius: 12px;
      min-height: 520px;
      border: 1px solid #374151;
      overflow: hidden;
    }

    .card-header {
      padding: 14px 16px;
      border-bottom: 1px solid #374151;
      font-weight: 600;
      color: #d1d5db;
      background: #111827;
    }

    .pulse {
      animation: pulse 1.6s ease-in-out infinite;
      height: calc(100% - 49px);
      background: linear-gradient(90deg, #1f2937 0%, #374151 50%, #1f2937 100%);
      background-size: 200% 100%;
    }

    @keyframes pulse {
      0% {
        background-position: 200% 0;
        opacity: 0.6;
      }

      50% {
        opacity: 1;
      }

      100% {
        background-position: -200% 0;
        opacity: 0.6;
      }
    }
  </style>
</head>

<body>
  <div class="workspace">
    <div class="bg-pattern">
      <div class="bg-glow"></div>
    </div>

    <div class="content">
      <div class="grid">
        <!-- ChatView placeholder -->
        <section class="card">
          <div class="card-header">ChatView</div>
          <div class="pulse"></div>
        </section>

        <!-- CodeView placeholder -->
        <section class="card code-col">
          <div class="card-header">CodeView</div>
          <div class="pulse"></div>
        </section>
      </div>
    </div>
  </div>
</body>

</html>
